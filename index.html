<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Haven - Books</title>
    <link rel="stylesheet" href="/stylecss/styl.css">
</head>
<body>
    <header>
        <div class="logo">Book Haven</div>
        <nav>
            <ul>
              <li><a href="inde.html" class="active">ទំព័រដេីម</a></li>
              <li><a href="index.html">សៀវភៅ</a></li>
              <li><a href="page.html">វិញ្ញាសារបាក់ឌុប</a></li>
              <li><a href="about.html#contact">បណ្ណាគារ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="book-search">
            <h1>Find Your Next Read</h1>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search by title, author, or genre...">
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="book-filters">
            <h2>Browse by Category</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="fiction">Fiction</button>
                <button class="filter-btn" data-category="non-fiction">Non-Fiction</button>
                <button class="filter-btn" data-category="science">Science</button>
                <button class="filter-btn" data-category="history">History</button>
                <button class="filter-btn" data-category="children">Children</button>
            </div>
        </section>

        <section class="book-results">
            <h2 id="results-title">Featured Books</h2>
            <div class="book-grid" id="book-container">
                <!-- Books will be loaded from JS -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Book Haven. All rights reserved.</p>
    </footer>

    <script src="/js/main.js"></script>
</body>
</html>
